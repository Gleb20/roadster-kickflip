s="panel hidden" aria-live="polite"><div class="eyebrow" id="endlabel">НЕ ВСЁ ВЗЛЕТАЕТ.</div><h2>RAPID<br><em>DISASSEMBLY.</em></h2><p id="reason"></p><div class="stats"><div><label>СЧЁТ</label><strong id="finalScore">0</strong></div><div><label>КИКФЛИПЫ</label><strong id="flips">0</strong></div></div><button class="primary" id="restart">ЕЩЁ ПОПЫТКА <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11a8 8 0 1 1 2 7M4 4v7h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></section><section id="paused" class="panel hidden"><div class="eyebrow">ПИТ-СТОП</div><h2>НА ПАУЗЕ.</h2><p>Марс подождёт.</p><button id="resume" class="primary">ПРОДОЛЖИТЬ <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 5 11 7-11 7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></section><footer><span id="status">01 / TEXAS TEST TRACK</span><span>FAN-MADE • UNOFFICIAL</span></footer><button id="jump" class="hidden" aria-label="Зажми и отпусти для прыжка"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 17q7-14 14-10M13 5l6 2-2 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span><span class="desktop-tip">Зажми и отпусти для прыжка</span><span class="mobile-tip">Зажми экран и отпусти</span><small>Чуть подержи — прыгнешь выше</small></span></button></main><script>'use strict';

rect(-w/2+5,-h,w-14,h-6,'#f3ede0',4);rect(-w/2+8,-h+3,w-20,h-12,'#b64c3d',3);rect(-17,-h+10,28,23,'#24343d',2);text('V8',-3,-h+17+12,12,'#e1f2bd');rect(-18,-32,30,17,'#e9d9b9',2);text('OIL',-3,-20,10,'#713e31');paperLimb([[15,-h+18],[26,-h+10],[28,-22],[18,-19],[18,-40]],'#2a3035',5);rect(-25,-8,48,8,'#e6dbc8',2);
}else{
line([[0,-h+15],[7,-h-2]],'#f3eee3',3);ellipse(7,-h-2,4,4,'#d9ff62');rect(-30,-h+10,60,h-17,'#eee8db',12);rect(-26,-h+14,52,25,'#434e55',9);ellipse(-11,-h+25,8,9,'#fff8e7');ellipse(11,-h+25,8,9,'#fff8e7');ellipse(-8,-h+24,3,4,'#161b23');ellipse(13,-h+24,3,4,'#161b23');text('AI',0,-13,12,'#5d686c');wheel(-20,-6,8);wheel(20,-6,8);
}}
function obstacle(o){ctx.save();ctx.translate(o.x*scale,ground);ctx.scale(scale,scale);const bob=['trump','protest','doge'].includes(o.id)?Math.sin(Math.floor(sceneTime*7)+o.x*.01)*1.1:0;ctx.translate(o.w/2,0);ctx.rotate(bob*.008);(cutouts[o.id]?cutout(o.id,-o.w/2,-o.h+bob,o.w,o.h):paperProp(o));ctx.rotate(-bob*.008);text(o.name,0,18,8,'#a9b3aa');ctx.restore()}
function comicBurst(x,y,r,label,alpha=1){ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;const points=[];for(let i=0;i<24;i++){let a=i*Math.PI/12,rr=i%2?r*.65:r;points.push([Math.cos(a)*rr,Math.sin(a)*rr*.55])}poly(points,'#ffcf62','#e76d3b');text(label,0,5,Math.max(12,r*.24),'#3a2b27');ctx.restore()}
// Event starts are 20–40 seconds apart, including recovery after a failure.
const randomGap=()=>20+Math.random()*20;
const R={phase:'ready',t:0,next:randomGap(),eventStart:null,fail:false,crashLift:0,kind:'launch',events:0};
function rocketEvent(now){R.kind=R.phase==='orbit'?'landing':'launch';R.phase=R.kind;R.t=0;R.fail=Math.random()<.28;R.eventStart=now;R.next=now+randomGap();R.events++}
function rocketBoom(lift){R.crashLift=lift;R.phase='explosion';R.t=0;tone(55,.6,'sawtooth',.025)}
function updateRocket(dt){R.t+=dt;
if((R.phase==='ready'||R.phase==='orbit')&&sceneTime>=R.next)rocketEvent(sceneTime);
if(R.phase==='launch'){if(R.fail&&R.t>=2)rocketBoom(50);else if(R.t>=6){R.phase='orbit';R.t=0}}
else if(R.phase==='landing'){if(R.fail&&R.t>=5.2)rocketBoom(3);else if(R.t>=6){R.phase='ready';R.t=0}}
else if(R.phase==='explosion'&&R.t>=3.5){R.phase='delivery';R.t=0}
else if(R.phase==='delivery'&&R.t>=10){R.phase='ready';R.t=0}
}
const clamp01=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp01(v);return v*v*(3-2*v)};
function rocketBody(x,y,h,angle=0,alpha=1){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha=alpha*.84;cutout('rocket',-h*.15,-h,h*.3,h);ctx.restore()}
function exhaust(x,y,power=1){const f=(Math.sin(sceneTime*37)*.12+1)*power;
poly([[x-10,y-4],[x-21,y+18*f],[x-9,y+12*f],[x-3,y+60*f],[x+7,y+29*f],[x+17,y+35*f],[x+10,y-4]],'#ee6a3c','#ffcf74');poly([[x-5,y-3],[x-8,y+17*f],[x+1,y+40*f],[x+7,y+14*f],[x+5,y-3]],'#fff3b6');}
function launchSmoke(x,y,t,opacity=1){ctx.save();ctx.globalAlpha=opacity;for(let i=0;i<10;i++){const spread=10+i*7+Math.min(t,4)*13;ellipse(x+(i%2?1:-1)*spread,y-i%3*4,12+spread*.2,7+spread*.1,['#cfc7b28a','#e8dcc07a','#85918c80'][i%3])}ctx.restore()}
function crawler(x,y,loaded,h,raise=0){ctx.save();ctx.translate(x,y);
// Two continuous tracks and an elevating launch cradle.
rect(-77,-17,154,23,'#eee9dc',10);rect(-74,-14,148,17,'#283238',8);
for(let i=0;i<12;i++){const tx=-64+i*12;ellipse(tx,-5,5,5,'#727b77');line([[tx+Math.sin(sceneTime*10)*3,-12],[tx+Math.sin(sceneTime*10)*3+4,1]],'#afb5a4',1)}
rect(-79,-26,158,12,'#c4c8ad',3);rect(-77,-25,28,16,'#727f70',3);rect(-74,-23,14,8,'#b9d8d1',1);
for(let i=0;i<9;i++)poly([[-45+i*13,-25],[-39+i*13,-25],[-44+i*13,-15],[-50+i*13,-15]],'#a7893c');
const angle=-(1-ease(raise))*Math.PI/2,hingeX=22;
line([[hingeX,-28],[hingeX-45*(1-raise),-30-70*raise]],'#e4debd',4);
if(loaded)rocketBody(hingeX,-29,h,angle,1);
text('SPACE DELIVERY',-4,-31,7,'#dae1c6');ctx.restore()}
function rocketScene(){const rx=W*.81,base=ground-95,h=Math.min(190,Math.max(125,H*.22)),t=R.t,phase=R.phase,travel=H+h;
// Fixed launch pad, behind the playable road.
rect(rx-80,base+32,W-rx+80,8,'#34484b');line([[rx-80,base+32],[W,base+32]],'#71827d',2);for(const dx of [-31,25]){rect(rx+dx,base+18,6,39,'#485e60');line([[rx+dx-4,base+57],[rx+dx+10,base+57]],'#71827d',3)}line([[rx-25,base+22],[rx+25,base+53],[rx-25,base+53],[rx+25,base+22]],'#52696b',2);
rect(rx-49,base,98,8,'#71827d',2);rect(rx-36,base+8,72,14,'#304a50',2);for(let i=0;i<6;i++)rect(rx-40+i*15,base+1,7,3,'#c4b475');
let lift=0,angle=0;
if(phase==='launch'){lift=Math.pow(Math.max(0,t-.65)/5.35,2)*travel;angle=R.fail?Math.sin(t*13)*.05:0}
if(phase==='landing'){lift=Math.pow(1-clamp01(t/6),2)*travel;angle=R.fail?Math.sin(t*8)*.09:Math.sin(t*3)*.018}
if(phase==='launch'||phase==='landing'){
const glow=ctx.createRadialGradient(rx,base-lift,4,rx,base-lift,150);glow.addColorStop(0,'#ffbe4d30');glow.addColorStop(1,'#ff9a2000');ctx.fillStyle=glow;ctx.fillRect(rx-160,base-lift-160,320,320);
exhaust(rx,base-lift,phase==='landing'?.45+lift/travel:Math.min(1.2,.4+t*.35));if(lift<120)launchSmoke(rx,base,t,1-lift/160);
rocketBody(rx+Math.sin(t*40)*.9,base-lift,h,angle);
if(phase==='launch'&&t>.5&&t<1.8)comicBurst(rx-55,base-h*.6,40,'FWOOSH!',Math.min(1,(1.8-t)*2));
}else if(phase==='ready') {rocketBody(rx,base,h);if(R.kind==='landing'&&t<2){launchSmoke(rx,base,1,1-t/2);text('STILL IN ONE PIECE.',rx,base-h-12,9,'#bdd59c')}}
else if(phase==='explosion'){
const fade=1-clamp01((t-1)/2.5),by=base-R.crashLift;
rocketBody(rx,by,h,.12*Math.sin(t*8),fade);
ctx.save();ctx.globalAlpha=fade;
for(let i=0;i<12;i++){const a=i*Math.PI*2/12,dist=(18+t*35)*(1+i%3*.2);ellipse(rx+Math.cos(a)*dist,by-h*.35+Math.sin(a)*dist*.65,18+t*4,16+t*3,i%3===0?'#ffdd7a':i%3===1?'#ed773d':'#6b6e67')}
for(let i=0;i<10;i++){const a=i*2.4;ctx.save();ctx.translate(rx+Math.cos(a)*t*44,by-h*.35-Math.sin(a)*t*40+t*t*16);ctx.rotate(t*(i%2?2:-3));rect(-3,-6,6,12,i%2?'#d4d7ce':'#edac54');ctx.restore()}
ctx.restore();if(t<2.5)comicBurst(rx-20,by-h*.48,Math.min(78,35+t*70),'KABOOM!',Math.min(1,(2.5-t)*2));launchSmoke(rx,base,t,fade);
}else if(phase==='delivery'){
let x,loaded=t<7,raise=t<3.5?0:ease((t-3.5)/2.5);
if(t<3.5)x=(W+220)+(rx-22-W-220)*ease(t/3.5);
else if(t<7)x=rx-22;
else x=rx-22+(W+220-rx+22)*ease((t-7)/3);
if(t>=6.5)rocketBody(rx,base,h);
crawler(x,base+29,loaded&&t<6.5,h,raise);
}
}
function background(time){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#10151d');grad.addColorStop(.7,'#1b303b');grad.addColorStop(1,'#101c23');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){let x=(i*157.13)%W,y=(i*i*31.7)%(ground*.78);ellipse(x,y,i%5===0?1.2:.65,i%5===0?1.2:.65,'#79929966')}const mx=W*.82,my=H*.26;ellipse(mx,my,44,44,'#aec7be12');ellipse(mx,my,29,29,'#c9d2b7');ellipse(mx-9,my-9,8,6,'#adbda5');ellipse(mx+10,my+7,5,8,'#b7c3ac');const shift=S.distance*scale*.08;for(let i=-1;i<W/180+2;i++){let x=i*180-shift%180;poly([[x,ground-42],[x+45,ground-130],[x+125,ground-52],[x+180,ground-105],[x+230,ground]],'#1d333d')}rocketScene();rect(0,ground-38,W,38,'#172932');for(let i=0;i<8;i++){let x=(i*231-S.distance*.15)%(W+250);rect(x,ground-52,110,14,'#253d46');rect(x+9,ground-46,14,3,'#c2dc8955')}line([[0,ground],[W,ground]],'#8daca1',2);rect(0,ground+2,W,H-ground,'#111d24');for(let i=-1;i<W/110+2;i++){let x=i*110-(S.distance*scale)%110;line([[x,ground+42],[x+50,ground+42]],'#48605c',2)}for(let i=0;i<5;i++)line([[0,ground+74+i*30],[W,ground+74+i*30]],'#23323a',.5)}
function render(dt,time){background(time);let demo=S.mode==='menu';let x=demo?(W<600?W*.7:W*.72):px;let ds=demo?Math.min(1.4,scale*1.25):scale;let hop=demo?Math.max(0,Math.sin(time*1.4))*22:S.y;ellipse(x,ground+5,48*ds,(7-hop*.015)*ds,'#0007');for(const o of S.obs)obstacle(o);ctx.save();ctx.translate(x,ground-hop*ds-12*ds);ctx.scale(ds,ds);let phase=S.y>0?Math.min(1,S.jumpTime/(2*S.launchSpeed/GRAVITY)):0;if(demo)phase=0;let gap=S.y>0?Math.sin(phase*Math.PI)*24:0;if(S.y>0){for(let k=0;k<3;k++)line([[-36-k*12,8+gap],[-70-k*20,15+gap]],'#b8f8ff55',2);if(phase<.2||phase>.82){poly([[-30,7],[-41,38+Math.random()*16],[-20,7]],'#d0fcff66');poly([[25,7],[30,30+Math.random()*12],[37,7]],'#d0fcff66')}}car(0,gap,phase*Math.PI*2);elon(0,-22-gap*.2,S.y>0,time);if(S.charging){rect(-28,17,56,4,'#45574f',2);rect(-28,17,56*S.charge,4,'#d9ff62',2)};ctx.restore();for(const p of S.particles){if(S.mode!=='paused'){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}ctx.globalAlpha=Math.max(0,p.life);rect(p.x,p.y,3,3,p.c)}ctx.globalAlpha=1;S.particles=S.particles.filter(p=>p.life>0);if(demo){text('ELON / ROCKET RIDER',x,ground+31,8,'#b5c7bd');}}
function frame(ts){let dt=Math.min((ts-last)/1000||0,.025);last=ts;if(S.mode==='playing'||S.mode==='menu'){sceneTime+=dt;updateRocket(dt)}update(dt);render(dt,sceneTime);requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
window.render_game_to_text=()=>JSON.stringify({mode:S.mode,score:S.score,best,y:S.y,speed:S.speed,playerX:px/scale,obstacles:S.obs.map(o=>({type:o.id,x:o.x,w:o.w,h:o.h})),flips:S.flips,charging:S.charging,charge:S.charge,rocket:{phase:R.phase,nextEventIn:Math.max(0,R.next-sceneTime),events:R.events}});
</script></body></html>
