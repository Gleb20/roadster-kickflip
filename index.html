</style></head><body><main id="game"><canvas id="scene" aria-label="Игровое поле: Илон на Tesla перепрыгивает препятствия"></canvas><header><a class="brand" href="./">R<span>↗</span><small>ROADSTER<br>KICKFLIP</small></a><div class="tools"><button id="sound" aria-label="Включить звук">♪ <span>OFF</span></button><button id="pause" aria-label="Пауза">Ⅱ</button></div></header><section class="hud"><div><label>СЧЁТ</label><strong id="score">00000</strong></div><div class="record"><label>ЛИЧНЫЙ РЕКОРД</label><strong id="best">00000</strong></div></section><div id="toast" aria-live="polite"></div><section id="menu"><div class="eyebrow"><i></i> НЕВЕРОЯТНО. НО ПОЕХАЛИ.</div><h1>MAKE<br>IT <em>FLIP.</em></h1><p>Маленькая Tesla. Большое эго.<br>Один тап — и ты выше всего этого.</p><button id="start" class="primary">ПОГНАЛИ <span>↗</span></button><div class="hint"><span>☝</span> Тап / клик / пробел — кикфлип</div></section><section id="result" class="panel hidden" aria-live="polite"><div class="eyebrow" id="endlabel">НЕ ВСЁ ВЗЛЕТАЕТ.</div><h2>RAPID<br><em>DISASSEMBLY.</em></h2><p id="reason"></p><div class="stats"><div><label>СЧЁТ</label><strong id="finalScore">0</strong></div><div><label>КИКФЛИПЫ</label><strong id="flips">0</strong></div></div><button class="primary" id="restart">ЕЩЁ ПОПЫТКА <span>↻</span></button></section><section id="paused" class="panel hidden"><div class="eyebrow">ПИТ-СТОП</div><h2>НА ПАУЗЕ.</h2><p>Марс подождёт.</p><button id="resume" class="primary">ПРОДОЛЖИТЬ <span>→</span></button></section><footer><span id="status">01 / TEXAS TEST TRACK</span><span>FAN-MADE • UNOFFICIAL</span></footer><button id="jump" class="hidden" aria-label="Подпрыгнуть и сделать кикфлип"><span class="desktop-tip">Кликни для прыжка</span><span class="mobile-tip">Жми на экран, чтобы прыгнуть</span> <b>↗</b></button></main><script>'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');

let best=0;try{best=Number(localStorage.getItem('roadster-best-v1'))||0}catch{}$('best').textContent=String(best).padStart(5,'0');

function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.min(1.25,Math.max(.68,W/650));ground=H*.84;px=W<600?W*.24:W*.29;}addEventListener('resize',resize);resize();
function tone(f,d=.1,type='sine',v=.04){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.5,audio.currentTime+d);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function ui(){for(let [id,mode] of [['menu','menu'],['result','dead'],['paused','paused']])$(id).classList.toggle('hidden',S.mode!==mode);$('jump').classList.toggle('hidden',S.mode!=='playing'||learnedJump);$('pause').style.visibility=['playing','paused'].includes(S.mode)?'visible':'hidden'}
function start(){if(!spritesReady)return;Object.assign(S,{mode:'playing',t:0,distance:0,score:0,bonus:0,flips:0,y:0,vy:0,jumpTime:0,speed:285,next:5.0,obs:[],particles:[],toast:0});$('toast').textContent='';$('score').textContent='00000';$('status').textContent='0 M / 95 KM/H';ui();tone(500)}
function jump(){if(S.mode!=='playing'||S.y>0)return;S.vy=760;S.y=.01;S.jumpTime=0;S.flips++;learnedJump=true;$('jump').classList.add('hidden');try{localStorage.setItem('roadster-jump-learned','1')}catch{}S.bonus+=10;burst(px,ground-8,14,'#c9f9ff');tone(660,.18,'triangle')}
function pause(){if(S.mode==='playing')S.mode='paused';else if(S.mode==='paused')S.mode='playing';ui()}
$('start').onclick=start;$('restart').onclick=start;$('resume').onclick=pause;$('pause').onclick=pause;$('jump').onpointerdown=e=>{e.preventDefault();jump()};$('game').onpointerdown=e=>{if(e.target.closest('button,a'))return;e.preventDefault();jump()};$('sound').onclick=()=>{sound=!sound;$('sound').innerHTML='♪ <span>'+(sound?'ON':'OFF')+'</span>';tone(600)};
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(e.repeat)return;if(S.mode==='menu'||S.mode==='dead')start();else jump()}if(e.code==='Escape'||e.code==='KeyP')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='playing')pause()});
function burst(x,y,n,c){for(let i=0;i<n;i++)S.particles.push({x,y,vx:(Math.random()-.5)*180,vy:-Math.random()*160,life:.5+Math.random()*.3,c})}
const types=[{id:'v8',name:'V8 • VERY LOUD',w:108,h:40},{id:'trump',name:'TARIFF MAN',w:54,h:90},{id:'protest',name:'COMMENT SECTION',w:94,h:87},{id:'truck',name:'CYBERBRICK',w:110,h:48},{id:'doge',name:'MUCH WOW',w:52,h:64}];
function die(o){S.mode='dead';tone(90,.35,'sawtooth');burst(px,ground-S.y*scale,24,'#ff835e');const record=S.score>best;if(record){best=S.score;try{localStorage.setItem('roadster-best-v1',best)}catch{}}$('best').textContent=String(best).padStart(5,'0');$('finalScore').textContent=S.score;$('flips').textContent=S.flips;$('reason').textContent='На пути оказался '+o.name+'. Ещё один запуск?';$('endlabel').textContent=record?'НОВЫЙ ЛИЧНЫЙ РЕКОРД!':'НЕ ВСЁ ВЗЛЕТАЕТ.';$('toast').textContent='';ui()}
function update(dt){if(S.mode!=='playing')return;S.t+=dt;S.speed=Math.min(440,285+S.t*2.1);S.distance+=S.speed*dt;S.score=Math.floor(S.distance/20)+S.bonus;S.next-=dt;if(S.next<=0){const type=types[Math.floor(Math.random()*types.length)];S.obs.push({...type,x:W/scale+120,passed:false});S.next=1.8+Math.random()*.65}if(S.y>0){S.jumpTime+=dt;S.vy-=1550*dt;S.y+=S.vy*dt;if(S.y<=0){S.y=0;S.vy=0;burst(px,ground-5,8,'#d9ff62');tone(130,.08)}}for(const o of S.obs){o.x-=S.speed*dt;let dx=o.x-px/scale;if(dx<29&&dx+o.w>-25&&S.y<o.h-8){die(o);break}if(!o.passed&&dx+o.w<-30){o.passed=true;S.bonus+=50;S.toast=.8;$('toast').textContent=['CLEAN FLIP +50','TO THE MOON +50','ABSOLUTELY +50'][Math.floor(Math.random()*3)];tone(920,.12)}}S.obs=S.obs.filter(o=>o.x+o.w>-100);S.toast-=dt;if(S.toast<=0)$('toast').textContent='';$('score').textContent=String(S.score).padStart(5,'0');$('status').textContent=`${Math.floor(S.distance/10)} M / ${Math.floor(S.speed/3)} KM/H`}
function poly(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function rect(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function line(p,c,w=2){ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function text(t,x,y,size,c,align='center'){ctx.fillStyle=c;ctx.font=`bold ${size}px Arial`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function wheel(x,y,r){ellipse(x,y,r,r,'#080d12');ellipse(x,y,r*.55,r*.55,'#6a7983');line([[x-r*.4,y],[x+r*.4,y]],'#c0c8c9',2)}
let spritesReady=false;
const atlas=new Image(),extras=new Image();
$('start').disabled=true;$('start').textContent='ЗАГРУЖАЕМ ВЫРЕЗКИ…';
const loadSprite=(img,src)=>new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src});
Promise.all([loadSprite(atlas,'collage-atlas.png'),loadSprite(extras,'collage-extras.png')]).then(()=>{spritesReady=true;$('start').disabled=false;$('start').innerHTML='ПОГНАЛИ <span>↗</span>'}).catch(()=>{$('start').textContent='ОБНОВИТЕ СТРАНИЦУ';$('menu').querySelector('p').textContent='Не удалось загрузить графику. Проверьте интернет и обновите страницу.'});
const cutouts={head:[atlas,40,40,380,410],roadster:[atlas,475,185,550,180],v8:[atlas,1025,185,510,180],trump:[atlas,90,490,300,505],truck:[atlas,450,655,635,260],rocket:[atlas,1190,455,195,545],protest:[extras,0,110,890,825],doge:[extras,945,145,585,790]};
function cutout(key,x,y,w,h){const [img,sx,sy,sw,sh]=cutouts[key];if(!img.complete||!img.naturalWidth)return false;ctx.drawImage(img,sx*img.naturalWidth/1536,sy*img.naturalHeight/1024,sw*img.naturalWidth/1536,sh*img.naturalHeight/1024,x,y,w,h);return true}
function paperLimb(points,color,width){line(points,'#f5eee2',width+3);line(points,color,width)}
function car(x,y,flip=0){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(flip)*.12);ctx.scale(1,Math.cos(flip));if(!cutout('roadster',-49,-23,98,34)){rect(-45,-10,90,18,'#eee9db',4)}if(Math.cos(flip)<-.2){ctx.globalAlpha=.72;rect(-30,-4,60,9,'#28333b',3);ctx.globalAlpha=1}ctx.restore()}
function elon(x,y,air,pose=0){ctx.save();ctx.translate(x,y);ctx.rotate(air?-.085:Math.sin(Math.floor(pose*9)*.45)*.018);const bend=air?10:0;
paperLimb([[-11,-43],[-22,-25-bend],[-25,0]],'#343b43',15);paperLimb([[12,-43],[24,-27-bend],[25,0]],'#42464c',15);
paperLimb([[-33,1],[-17,1]],'#181d23',7);paperLimb([[17,1],[35,1]],'#181d23',7);
poly([[-26,-92],[18,-92],[27,-55],[18,-40],[-20,-42],[-28,-67]],'#252a2d','#f5eee2');
text('X',0,-63,24,'#fff7e8');
paperLimb([[-22,-82],[-35,-65],[-44,air?-90:-65]],'#303536',12);paperLimb([[22,-82],[33,-65],[44,air?-92:-68]],'#303536',12);
ellipse(-44,air?-92:-65,7,8,'#f5eee2');ellipse(-44,air?-92:-65,5,6,'#e8ba8d');ellipse(44,air?-94:-68,7,8,'#f5eee2');ellipse(44,air?-94:-68,5,6,'#e8ba8d');
ctx.save();ctx.translate(0,-92);ctx.rotate(air?.11:Math.sin(Math.floor(pose*6))*.025);if(!cutout('head',-34,-74,72,79))ellipse(0,-39,28,36,'#ecc29e');ctx.restore();ctx.restore()}
function obstacle(o){ctx.save();ctx.translate(o.x*scale,ground);ctx.scale(scale,scale);const bob=['trump','protest','doge'].includes(o.id)?Math.sin(Math.floor(sceneTime*7)+o.x*.01)*1.1:0;ctx.translate(o.w/2,0);ctx.rotate(bob*.008);cutout(o.id,-o.w/2,-o.h+bob,o.w,o.h);ctx.rotate(-bob*.008);text(o.name,0,18,8,'#a9b3aa');ctx.restore()}
function comicBurst(x,y,r,label,alpha=1){ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;const points=[];for(let i=0;i<24;i++){let a=i*Math.PI/12,rr=i%2?r*.65:r;points.push([Math.cos(a)*rr,Math.sin(a)*rr*.55])}poly(points,'#ffcf62','#e76d3b');text(label,0,5,Math.max(12,r*.24),'#3a2b27');ctx.restore()}
function rocketScene(){const cycle=sceneTime%29,rx=W*.83,base=ground-40;const launch=cycle>=9&&cycle<16;let lift=launch?Math.pow(cycle-9,2)*34:0;const visible=cycle<16||cycle>26;let alpha=cycle>26?(cycle-26)/3:1;
if(cycle>=7&&cycle<16){const glow=ctx.createRadialGradient(rx,base,5,rx,base,Math.max(150,W*.3));glow.addColorStop(0,'#ffcb5644');glow.addColorStop(1,'#ff9a2000');ctx.fillStyle=glow;ctx.fillRect(0,0,W,ground)}
if(launch){const flicker=Math.sin(sceneTime*35)*12,fy=base-lift;poly([[rx-11,fy-7],[rx-28,fy+30],[rx-13,fy+22],[rx-5,fy+90+flicker],[rx+6,fy+44],[rx+17,fy+67],[rx+23,fy+20],[rx+11,fy-7]],'#f66c38','#f9d171');poly([[rx-6,fy-6],[rx-10,fy+27],[rx+1,fy+54+flicker/2],[rx+10,fy+20],[rx+5,fy-6]],'#fff2a3');
for(let i=0;i<8;i++){let off=(cycle-9)*16+i*14;ellipse(rx+(i%2?1:-1)*off,base+2-i%3*5,14+off*.28,8+off*.14,['#d8c8a999','#f4e4c377','#a9ada077'][i%3])}
if(cycle<11.2)comicBurst(rx-45,base-115,52,'FWOOSH!',Math.min(1,(11.2-cycle)*2));}
if(cycle>=6&&cycle<9){text(String(Math.ceil(9-cycle))+'…',rx-38,base-175,18,'#e8d58b')}
if(visible){ctx.save();ctx.globalAlpha=alpha*.72;const shake=launch?Math.sin(sceneTime*55)*1.5:0;cutout('rocket',rx-29+shake,base-200-lift,60,200);ctx.restore()}}
function background(time){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#10151d');grad.addColorStop(.7,'#1b303b');grad.addColorStop(1,'#101c23');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){let x=(i*157.13)%W,y=(i*i*31.7)%(ground*.78);ellipse(x,y,i%5===0?1.2:.65,i%5===0?1.2:.65,'#79929966')}const mx=W*.82,my=H*.26;ellipse(mx,my,44,44,'#aec7be12');ellipse(mx,my,29,29,'#c9d2b7');ellipse(mx-9,my-9,8,6,'#adbda5');ellipse(mx+10,my+7,5,8,'#b7c3ac');const shift=S.distance*scale*.08;for(let i=-1;i<W/180+2;i++){let x=i*180-shift%180;poly([[x,ground-42],[x+45,ground-130],[x+125,ground-52],[x+180,ground-105],[x+230,ground]],'#1d333d')}rocketScene();rect(0,ground-38,W,38,'#172932');for(let i=0;i<8;i++){let x=(i*231-S.distance*.15)%(W+250);rect(x,ground-52,110,14,'#253d46');rect(x+9,ground-46,14,3,'#c2dc8955')}line([[0,ground],[W,ground]],'#8daca1',2);rect(0,ground+2,W,H-ground,'#111d24');for(let i=-1;i<W/110+2;i++){let x=i*110-(S.distance*scale)%110;line([[x,ground+42],[x+50,ground+42]],'#48605c',2)}for(let i=0;i<5;i++)line([[0,ground+74+i*30],[W,ground+74+i*30]],'#23323a',.5)}
function render(dt,time){background(time);let demo=S.mode==='menu';let x=demo?(W<600?W*.7:W*.72):px;let ds=demo?Math.min(1.4,scale*1.25):scale;let hop=demo?Math.max(0,Math.sin(time*1.4))*22:S.y;ellipse(x,ground+5,48*ds,(7-hop*.015)*ds,'#0007');for(const o of S.obs)obstacle(o);ctx.save();ctx.translate(x,ground-hop*ds-12*ds);ctx.scale(ds,ds);let phase=S.y>0?Math.min(1,S.jumpTime/(1520/1550)):0;if(demo)phase=0;let gap=S.y>0?Math.sin(phase*Math.PI)*18:0;if(S.y>0){for(let k=0;k<3;k++)line([[-36-k*12,8+gap],[-70-k*20,15+gap]],'#b8f8ff55',2);if(phase<.2||phase>.82){poly([[-30,7],[-41,38+Math.random()*16],[-20,7]],'#d0fcff66');poly([[25,7],[30,30+Math.random()*12],[37,7]],'#d0fcff66')}}car(0,gap,phase*Math.PI*2);elon(0,-22-gap*.2,S.y>0,time);ctx.restore();for(const p of S.particles){if(S.mode!=='paused'){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}ctx.globalAlpha=Math.max(0,p.life);rect(p.x,p.y,3,3,p.c)}ctx.globalAlpha=1;S.particles=S.particles.filter(p=>p.life>0);if(demo){text('ELON / ROCKET RIDER',x,ground+31,8,'#b5c7bd');}}
function frame(ts){let dt=Math.min((ts-last)/1000||0,.025);last=ts;if(S.mode==='playing'||S.mode==='menu')sceneTime+=dt;update(dt);render(dt,sceneTime);requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
window.render_game_to_text=()=>JSON.stringify({mode:S.mode,score:S.score,best,y:S.y,speed:S.speed,playerX:px/scale,obstacles:S.obs.map(o=>({type:o.id,x:o.x,w:o.w,h:o.h})),flips:S.flips});
</script></body></html>
