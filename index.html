<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151b"><meta name="description" content="Илон на миниатюрном Roadster. Один тап — один кикфлип. Бесплатный браузерный раннер."><title>ROADSTER / KICKFLIP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#f1f3eb;font-family:Arial,Helvetica,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}#game{height:100%;height:100dvh;position:relative;isolation:isolate;overflow:hidden;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}header{position:absolute;top:max(24px,env(safe-area-inset-top));left:5%;right:5%;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;color:inherit;text-decoration:none;font-size:42px;font-weight:900;letter-spacing:-6px}.brand>span{color:#d9ff62;font-size:38px}.brand small{font-size:10px;line-height:1.3;letter-spacing:2px;margin-left:18px}.tools{display:flex;gap:8px}.tools button{border:1px solid #ffffff24;background:#ffffff05;color:#f0f2e9;border-radius:50px;height:40px;min-width:40px;padding:0 12px}.tools span{font-size:9px;letter-spacing:1px}.hud{position:absolute;top:110px;left:5%;right:5%;display:flex;justify-content:space-between;pointer-events:none}label{display:block;font-size:9px;letter-spacing:2px;color:#8d9b9f;margin-bottom:7px}strong{font:500 28px monospace;letter-spacing:1px}.record{text-align:right}.record strong{color:#a8b3b5;font-size:22px}#menu{position:absolute;left:8%;top:26%;max-width:600px}.eyebrow{font:10px monospace;letter-spacing:2px;color:#c8e88a}.eyebrow i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d9ff62;margin-right:8px}h1{font-size:clamp(62px,10vw,132px);font-weight:900;font-style:italic;line-height:.85;letter-spacing:-5px;margin:24px 0}em{color:#d9ff62;font-style:inherit}p{font-size:14px;line-height:1.7;color:#a3afb3}button.primary{display:flex;align-items:center;justify-content:space-between;gap:35px;width:260px;background:#d9ff62;border:0;border-radius:4px;padding:19px 22px;font-size:12px;font-weight:800;letter-spacing:1px;color:#17201c;margin-top:26px}.primary span{font-size:24px;line-height:16px}.hint{font-size:10px;color:#8e9b9f;margin-top:16px}.hint span{margin-right:6px}footer{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:5%;right:5%;display:flex;justify-content:space-between;color:#63747c;font:9px monospace;letter-spacing:1px}.panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:32px;background:#10181af5;border:1px solid #d9ff6230;border-radius:12px;width:min(420px,90%);box-shadow:0 20px 90px #0008}.panel h2{font-size:32px;letter-spacing:-1px;line-height:1.05}.panel h2 em{font-size:27px}.panel .primary{width:100%}.stats{display:flex;gap:50px;margin:25px 0}.hidden{display:none!important}#toast{position:absolute;top:26%;width:100%;text-align:center;color:#d9ff62;font:bold italic 25px Arial;pointer-events:none;text-shadow:0 2px 20px #000}#jump{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);border:1px solid #d9ff6255;color:#d9ff62;background:#17221dcc;padding:16px 28px;border-radius:100px;font-size:11px;letter-spacing:3px}#jump span{margin-left:16px}button:focus-visible{outline:3px solid #fff;outline-offset:4px}@media(min-width:800px){#menu{top:29%}.hud{top:110px}.record{position:absolute;right:0}#jump{bottom:65px}}@media(max-width:600px){#menu{top:25%;left:7%}h1{font-size:70px;letter-spacing:-4px;margin:20px 0}#menu p{font-size:12px}button.primary{padding:16px 20px;width:240px;margin-top:20px}.hint{font-size:9px}.hud{top:98px}strong{font-size:24px}footer{font-size:7px;letter-spacing:.4px}}@media(max-height:570px){#menu{top:30%;left:8%}h1{font-size:54px;margin:12px 0}#menu p,.hint{display:none}.hud{top:85px}#jump{bottom:35px}footer{bottom:12px}.panel{padding:20px}.panel h2{font-size:25px;margin:12px 0}.panel p{margin:8px 0}.stats{margin:12px 0}}
</style></head><body><main id="game"><canvas id="scene" aria-label="Игровое поле: Илон на Tesla перепрыгивает препятствия"></canvas><header><a class="brand" href="./">R<span>↗</span><small>ROADSTER<br>KICKFLIP</small></a><div class="tools"><button id="sound" aria-label="Включить звук">♪ <span>OFF</span></button><button id="pause" aria-label="Пауза">Ⅱ</button></div></header><section class="hud"><div><label>СЧЁТ</label><strong id="score">00000</strong></div><div class="record"><label>ЛИЧНЫЙ РЕКОРД</label><strong id="best">00000</strong></div></section><div id="toast" aria-live="polite"></div><section id="menu"><div class="eyebrow"><i></i> НЕВЕРОЯТНО. НО ПОЕХАЛИ.</div><h1>MAKE<br>IT <em>FLIP.</em></h1><p>Маленькая Tesla. Большое эго.<br>Один тап — и ты выше всего этого.</p><button id="start" class="primary">ПОГНАЛИ <span>↗</span></button><div class="hint"><span>☝</span> Тап / клик / пробел — кикфлип</div></section><section id="result" class="panel hidden" aria-live="polite"><div class="eyebrow" id="endlabel">НЕ ВСЁ ВЗЛЕТАЕТ.</div><h2>RAPID<br><em>DISASSEMBLY.</em></h2><p id="reason"></p><div class="stats"><div><label>СЧЁТ</label><strong id="finalScore">0</strong></div><div><label>КИКФЛИПЫ</label><strong id="flips">0</strong></div></div><button class="primary" id="restart">ЕЩЁ ПОПЫТКА <span>↻</span></button></section><section id="paused" class="panel hidden"><div class="eyebrow">ПИТ-СТОП</div><h2>НА ПАУЗЕ.</h2><p>Марс подождёт.</p><button id="resume" class="primary">ПРОДОЛЖИТЬ <span>→</span></button></section><footer><span id="status">01 / TEXAS TEST TRACK</span><span>FAN-MADE • UNOFFICIAL</span></footer><button id="jump" class="hidden" aria-label="Подпрыгнуть и сделать кикфлип">TAP TO FLIP <span>↗</span></button></main><script>'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');
const S={mode:'menu',t:0,distance:0,score:0,bonus:0,flips:0,y:0,vy:0,jumpTime:0,speed:285,next:1.8,obs:[],particles:[],toast:0};
let best=0;try{best=Number(localStorage.getItem('roadster-best-v1'))||0}catch{}$('best').textContent=String(best).padStart(5,'0');
let W,H,scale,ground,px,last=0,sound=false,audio;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.min(1.25,Math.max(.68,W/650));ground=H*.77;px=W<600?W*.24:W*.29;}addEventListener('resize',resize);resize();
function tone(f,d=.1,type='sine',v=.04){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.5,audio.currentTime+d);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function ui(){for(let [id,mode] of [['menu','menu'],['result','dead'],['paused','paused']])$(id).classList.toggle('hidden',S.mode!==mode);$('jump').classList.toggle('hidden',S.mode!=='playing');$('pause').style.visibility=['playing','paused'].includes(S.mode)?'visible':'hidden'}
function start(){Object.assign(S,{mode:'playing',t:0,distance:0,score:0,bonus:0,flips:0,y:0,vy:0,jumpTime:0,speed:285,next:1.6,obs:[],particles:[],toast:0});$('toast').textContent='';ui();tone(500)}
function jump(){if(S.mode!=='playing'||S.y>0)return;S.vy=760;S.y=.01;S.jumpTime=0;S.flips++;S.bonus+=10;burst(px,ground-8,14,'#c9f9ff');tone(660,.18,'triangle')}
function pause(){if(S.mode==='playing')S.mode='paused';else if(S.mode==='paused')S.mode='playing';ui()}
$('start').onclick=start;$('restart').onclick=start;$('resume').onclick=pause;$('pause').onclick=pause;$('jump').onpointerdown=e=>{e.preventDefault();jump()};canvas.onpointerdown=e=>{e.preventDefault();jump()};$('sound').onclick=()=>{sound=!sound;$('sound').innerHTML='♪ <span>'+(sound?'ON':'OFF')+'</span>';tone(600)};
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(e.repeat)return;if(S.mode==='menu'||S.mode==='dead')start();else jump()}if(e.code==='Escape'||e.code==='KeyP')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='playing')pause()});
function burst(x,y,n,c){for(let i=0;i<n;i++)S.particles.push({x,y,vx:(Math.random()-.5)*180,vy:-Math.random()*160,life:.5+Math.random()*.3,c})}
const types=[{id:'v8',name:'V8 MUSCLE',w:100,h:52},{id:'trump',name:'DONALD TRUMP',w:48,h:90},{id:'protest',name:'LIBERAL CREW',w:94,h:85},{id:'truck',name:'CYBERBRICK',w:110,h:61},{id:'doge',name:'MUCH WOW',w:52,h:64}];
function die(o){S.mode='dead';tone(90,.35,'sawtooth');burst(px,ground-S.y*scale,24,'#ff835e');const record=S.score>best;if(record){best=S.score;try{localStorage.setItem('roadster-best-v1',best)}catch{}}$('best').textContent=String(best).padStart(5,'0');$('finalScore').textContent=S.score;$('flips').textContent=S.flips;$('reason').textContent='На пути оказался '+o.name+'. Ещё один запуск?';$('endlabel').textContent=record?'НОВЫЙ ЛИЧНЫЙ РЕКОРД!':'НЕ ВСЁ ВЗЛЕТАЕТ.';$('toast').textContent='';ui()}
function update(dt){if(S.mode!=='playing')return;S.t+=dt;S.speed=Math.min(440,285+S.t*2.1);S.distance+=S.speed*dt;S.score=Math.floor(S.distance/20)+S.bonus;S.next-=dt;if(S.next<=0){const type=types[Math.floor(Math.random()*types.length)];S.obs.push({...type,x:W/scale+120,passed:false});S.next=1.8+Math.random()*.65}if(S.y>0){S.jumpTime+=dt;S.vy-=1550*dt;S.y+=S.vy*dt;if(S.y<=0){S.y=0;S.vy=0;burst(px,ground-5,8,'#d9ff62');tone(130,.08)}}for(const o of S.obs){o.x-=S.speed*dt;let dx=o.x-px/scale;if(dx<29&&dx+o.w>-25&&S.y<o.h-8){die(o);break}if(!o.passed&&dx+o.w<-30){o.passed=true;S.bonus+=50;S.toast=.8;$('toast').textContent=['CLEAN FLIP +50','TO THE MOON +50','ABSOLUTELY +50'][Math.floor(Math.random()*3)];tone(920,.12)}}S.obs=S.obs.filter(o=>o.x+o.w>-100);S.toast-=dt;if(S.toast<=0)$('toast').textContent='';$('score').textContent=String(S.score).padStart(5,'0');$('status').textContent=`${Math.floor(S.distance/10)} M / ${Math.floor(S.speed/3)} KM/H`}
function poly(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function rect(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function line(p,c,w=2){ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function text(t,x,y,size,c,align='center'){ctx.fillStyle=c;ctx.font=`bold ${size}px Arial`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function wheel(x,y,r){ellipse(x,y,r,r,'#080d12');ellipse(x,y,r*.55,r*.55,'#6a7983');line([[x-r*.4,y],[x+r*.4,y]],'#c0c8c9',2)}
function car(x,y,flip=0){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(flip)*.09);ctx.scale(1,Math.cos(flip));wheel(-29,6,8);wheel(30,6,8);poly([[-46,1],[-43,-10],[-23,-13],[-11,-23],[10,-25],[26,-12],[43,-8],[48,1],[39,7],[-40,7]],'#e5ebe8','#85949d');poly([[-22,-13],[-10,-22],[9,-23],[22,-13]],'#c5a66f');line([[-40,-5],[40,-5]],'#fff',2);poly([[-43,1],[45,1],[39,7],[-40,7]],'#81939d');line([[36,-8],[45,-6]],'#e2fffd',3);line([[-45,-7],[-39,-7]],'#ff665a',2);text('T',8,0,8,'#45525a');if(Math.cos(flip)<0){rect(-32,-6,64,14,'#26343d',4);ellipse(-15,1,6,6,'#688089');ellipse(15,1,6,6,'#688089')}ctx.restore()}
function elon(x,y,air,pose=0){ctx.save();ctx.translate(x,y);ctx.rotate(air?-.08:Math.sin(pose*4)*.012);const bend=air?10:0;line([[-10,-46],[-19,-24-bend],[-25,0]],'#232b36',15);line([[11,-46],[25,-29-bend],[23,-2]],'#303b47',15);line([[-32,1],[-17,1]],'#e7e9de',7);line([[17,0],[33,0]],'#e7e9de',7);poly([[-21,-89],[15,-91],[25,-53],[12,-42],[-16,-44],[-26,-64]],'#1c232b','#495059');text('X',0,-65,20,'#f0f1e9');line([[-20,-80],[-34,-61],[-44,air?-93:-68]],'#232a32',12);line([[18,-80],[34,-65],[45,air?-91:-72]],'#232a32',12);ellipse(-44,air?-94:-69,5,7,'#e5b497');ellipse(45,air?-92:-73,5,7,'#e5b497');rect(-8,-102,17,17,'#d59a7b',4);ellipse(0,-119,22,27,'#efc1a2');ellipse(19,-116,5,7,'#e1aa8a');poly([[-21,-121],[-24,-134],[-14,-145],[4,-147],[20,-137],[23,-123],[12,-132],[-1,-134],[-14,-128]],'#493b34');poly([[-21,-133],[-12,-144],[6,-146],[16,-138],[-1,-140]],'#6c5344');line([[-11,-121],[-4,-122]],'#765343',2);line([[6,-122],[13,-121]],'#765343',2);ellipse(-7,-118,1.8,1.8,'#3c4041');ellipse(10,-118,1.8,1.8,'#3c4041');line([[3,-118],[5,-111],[1,-110]],'#bd8567',1.5);line([[-6,-104],[3,-102],[12,-106]],'#8d5d4c',2);ctx.restore()}
function person(x,y,trump=false,variant=0){ctx.save();ctx.translate(x,y);line([[-9,-26],[-10,-3]],'#253241',10);line([[9,-26],[11,-3]],'#253241',10);poly([[-19,-62],[17,-62],[22,-24],[-22,-24]],trump?'#263e67':['#a96778','#658668','#7775a1'][variant%3]);poly([[-7,-61],[7,-61],[2,-30]],'#f2eee6');if(trump)poly([[-1,-60],[4,-55],[3,-31],[-2,-34]],'#f36b5e');ellipse(0,-75,17,19,trump?'#e6a277':'#d8b096');poly([[-17,-78],[-17,-91],[9,-96],[20,-85],[8,-85],[0,-89],[-9,-79]],trump?'#efd174':'#5d423a');line([[-7,-76],[-4,-76]],'#35323b',2);line([[6,-76],[9,-76]],'#35323b',2);line([[-3,-65],[6,-65]],'#915f4b',2);if(trump){line([[19,-54],[27,-65],[29,-79]],'#263e67',9);ellipse(29,-81,5,6,'#e6a277')}ctx.restore()}
function obstacle(o){ctx.save();ctx.translate(o.x*scale,ground);ctx.scale(scale,scale);if(o.id==='v8'){wheel(20,-9,13);wheel(79,-9,13);poly([[0,-17],[7,-37],[28,-39],[38,-54],[66,-54],[79,-39],[97,-35],[100,-12],[0,-12]],'#d97853','#f6af7e');poly([[34,-39],[41,-49],[63,-49],[73,-39]],'#1e3540');rect(38,-43,21,12,'#b7b9aa',2);text('V8',51,-24,13,'#301f20');line([[4,-29],[17,-29]],'#ffebaa',4)}else if(o.id==='trump')person(24,0,true);else if(o.id==='protest'){person(21,0,false,0);person(72,0,false,1);person(48,0,false,2);line([[10,-49],[6,-103]],'#ae936c',3);rect(-10,-119,48,25,'#e8e5d5',2);text('NOPE',14,-102,11,'#41534c')}else if(o.id==='truck'){wheel(24,-10,13);wheel(88,-10,13);poly([[0,-15],[5,-39],[44,-65],[105,-32],[110,-16]],'#8a9a9d','#c7d4d0');poly([[17,-39],[44,-57],[78,-39]],'#253b45');line([[8,-31],[102,-31]],'#e1f4e9',2);text('BRICK',58,-20,9,'#24323b')}else{ellipse(27,-26,25,26,'#cda468');poly([[7,-43],[6,-70],[23,-53]],'#dcb47b');poly([[31,-53],[48,-71],[48,-41]],'#dcb47b');ellipse(27,-43,22,20,'#ddbb82');ellipse(30,-33,13,10,'#f1dab0');ellipse(17,-45,3,3,'#252626');ellipse(35,-47,3,3,'#252626');ellipse(28,-36,4,3,'#282727');line([[26,-30],[34,-30]],'#795a3e',1.5)}text(o.name,o.w/2,23,8,'#9ca6a3');ctx.restore()}
function background(time){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#10151d');grad.addColorStop(.7,'#1b303b');grad.addColorStop(1,'#101c23');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){let x=(i*157.13)%W,y=(i*i*31.7)%(ground*.78);ellipse(x,y,i%5===0?1.2:.65,i%5===0?1.2:.65,'#79929966')}const mx=W*.82,my=H*.26;ellipse(mx,my,44,44,'#aec7be12');ellipse(mx,my,29,29,'#c9d2b7');ellipse(mx-9,my-9,8,6,'#adbda5');ellipse(mx+10,my+7,5,8,'#b7c3ac');const shift=S.distance*scale*.08;for(let i=-1;i<W/180+2;i++){let x=i*180-shift%180;poly([[x,ground-42],[x+45,ground-130],[x+125,ground-52],[x+180,ground-105],[x+230,ground]],'#1d333d')}const rx=W*.81-(S.distance*.025% (W+250));rect(rx-10,ground-196,24,153,'#354c55',5);poly([[rx-10,ground-196],[rx+2,ground-228],[rx+14,ground-196]],'#92a8ac');rect(rx-10,ground-145,24,20,'#182a35');poly([[rx-10,ground-75],[rx-26,ground-44],[rx-10,ground-44]],'#50636c');poly([[rx+14,ground-75],[rx+28,ground-44],[rx+14,ground-44]],'#50636c');text('X',rx+2,ground-157,13,'#bbc7c5');rect(0,ground-38,W,38,'#172932');for(let i=0;i<8;i++){let x=(i*231-S.distance*.15)%(W+250);rect(x,ground-52,110,14,'#253d46');rect(x+9,ground-46,14,3,'#c2dc8955')}line([[0,ground],[W,ground]],'#8daca1',2);rect(0,ground+2,W,H-ground,'#111d24');for(let i=-1;i<W/110+2;i++){let x=i*110-(S.distance*scale)%110;line([[x,ground+42],[x+50,ground+42]],'#48605c',2)}for(let i=0;i<5;i++)line([[0,ground+74+i*30],[W,ground+74+i*30]],'#23323a',.5)}
function render(dt,time){background(time);let demo=S.mode==='menu';let x=demo?(W<600?W*.7:W*.72):px;let ds=demo?Math.min(1.4,scale*1.25):scale;let hop=demo?Math.max(0,Math.sin(time*1.4))*22:S.y;ellipse(x,ground+5,48*ds,(7-hop*.015)*ds,'#0007');for(const o of S.obs)obstacle(o);ctx.save();ctx.translate(x,ground-hop*ds-12*ds);ctx.scale(ds,ds);let phase=S.y>0?Math.min(1,S.jumpTime/(1520/1550)):0;if(demo)phase=0;let gap=S.y>0?Math.sin(phase*Math.PI)*18:0;if(S.y>0){for(let k=0;k<3;k++)line([[-36-k*12,8+gap],[-70-k*20,15+gap]],'#b8f8ff55',2);if(phase<.2||phase>.82){poly([[-30,7],[-41,38+Math.random()*16],[-20,7]],'#d0fcff66');poly([[25,7],[30,30+Math.random()*12],[37,7]],'#d0fcff66')}}car(0,gap,phase*Math.PI*2);elon(0,-22-gap*.2,S.y>0,time);ctx.restore();for(const p of S.particles){if(S.mode!=='paused'){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}ctx.globalAlpha=Math.max(0,p.life);rect(p.x,p.y,3,3,p.c)}ctx.globalAlpha=1;S.particles=S.particles.filter(p=>p.life>0);if(demo){text('ELON / ROCKET RIDER',x,ground+31,8,'#b5c7bd');}}
function frame(ts){let dt=Math.min((ts-last)/1000||0,.025);last=ts;update(dt);render(dt,ts/1000);requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
window.render_game_to_text=()=>JSON.stringify({mode:S.mode,score:S.score,best,y:S.y,speed:S.speed,playerX:px/scale,obstacles:S.obs.map(o=>({type:o.id,x:o.x,w:o.w,h:o.h})),flips:S.flips});
</script></body></html>
